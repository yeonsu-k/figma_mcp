name: Validate Tokens

on:
  pull_request:
    paths: ['tokens/**']
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install

      - name: Validate JSON
        run: |
          find tokens -name "*.json" -exec node -c "JSON.parse(require('fs').readFileSync('{}', 'utf8'))" \;

      - name: Test build
        run: npm run tokens:build
