name: Deploy to GitHub Pages

on:
  push:
    branches:
      - figma_style
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: 📋 Checkout repository
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Tailwind v4 설치 문제 방지를 위해 캐시 비활성화
          # cache: 'npm'
          
      - name: 📥 Install dependencies
        run: |
          echo "Installing dependencies with Tailwind CSS v4..."
          npm install --verbose
          echo "Dependencies installed successfully"
        
      - name: 🔍 Debug - Verify installations
        run: |
          echo "=== Checking Tailwind installation ==="
          npm list @tailwindcss/vite tailwindcss || echo "Tailwind packages not found"
          echo "=== Checking Style Dictionary ==="
          npm list style-dictionary || echo "Style Dictionary not found"
        
      - name: 🎨 Build design tokens
        run: |
          echo "Building design tokens..."
          npm run tokens:build
          echo "Token build completed"
        
      - name: 🏗️ Build Nuxt.js for static hosting
        run: |
          echo "Building Nuxt.js static site with Tailwind v4..."
          npm run generate
          echo "Nuxt.js build completed"
        
      - name: 🔍 Debug - Check generated files
        run: |
          echo "=== Generated .output directory ==="
          ls -la .output/ || echo "No .output directory"
          ls -la .output/public/ || echo "No .output/public directory"
          
      - name: 📄 Setup GitHub Pages
        uses: actions/configure-pages@v4
        
      - name: 📤 Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.output/public'
          
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
      - name: 💬 Deployment Success Message
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "📍 Site URL: ${{ steps.deployment.outputs.page_url }}"
          echo "🌿 Branch: figma_style"
          echo "🎨 Tailwind CSS v4 enabled"