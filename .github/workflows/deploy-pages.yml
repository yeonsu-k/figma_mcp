name: Deploy to GitHub Pages

on:
  push:
    branches:
      - figma_style  # figma_style 브랜치 푸시 시 배포
  workflow_dispatch:

# GitHub Pages 배포를 위한 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 토큰 빌드 단계
  build-tokens:
    runs-on: ubuntu-latest
    steps:
      - name: 📋 Checkout repository
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: 📥 Install dependencies
        run: npm install
        
      - name: 🎨 Build design tokens
        run: npm run tokens:build
        
      - name: 📤 Upload token artifacts
        uses: actions/upload-artifact@v4
        with:
          name: design-tokens
          path: |
            assets/css/design-tokens.css
            assets/css/theme-tokens.css
            composables/useDesignTokens.ts
          retention-days: 1

  # Nuxt.js 빌드 및 배포 단계
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: build-tokens
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: 📋 Checkout repository
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: 📥 Download token artifacts
        uses: actions/download-artifact@v4
        with:
          name: design-tokens
          
      - name: 🔍 Debug - Check downloaded tokens
        run: |
          echo "=== Downloaded token files ==="
          ls -la
          ls -la assets/css/ || echo "No assets/css"
          ls -la composables/ || echo "No composables"
          
      - name: 📥 Install dependencies
        run: npm install
        
      - name: 🎨 Build design tokens (재빌드)
        run: npm run tokens:build
        
      - name: 🏗️ Build Nuxt.js for static hosting
        run: npm run generate
        
      - name: 🔍 Debug - Check generated files
        run: |
          echo "=== Generated .output directory ==="
          ls -la .output/ || echo "No .output directory"
          ls -la .output/public/ || echo "No .output/public directory"
          
      - name: 📄 Setup GitHub Pages
        uses: actions/configure-pages@v4
        
      - name: 📤 Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.output/public'
          
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
      - name: 💬 Deployment Success Message
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "📍 Site URL: ${{ steps.deployment.outputs.page_url }}"
          echo "🌿 Branch: figma_style"