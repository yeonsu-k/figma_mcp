name: Build Tokens & Deploy Pages

on:
  push:
    branches: [figma_style]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild tokens'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: 'build-deploy-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  # Job 1: 토큰 빌드 및 커밋
  build-tokens:
    runs-on: ubuntu-latest
    outputs:
      tokens-changed: ${{ steps.changes.outputs.changed }}

    steps:
      - name: 📋 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔍 Check trigger
        run: |
          echo "=== Build Design Tokens Triggered ==="
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Changed files:"
            git diff --name-only HEAD~1 HEAD | grep "tokens/" || echo "No token files changed"
          fi

      - name: 📥 Install dependencies
        run: |
          echo "Installing dependencies..."
          npm install

      - name: 🎨 Build design tokens
        run: |
          echo "Building design tokens from tokens/global.json..."
          npm run tokens:build
          echo "✅ Token build completed"

      - name: 🔍 Check generated files
        run: |
          echo "=== Generated files check ==="
          ls -la assets/css/ || echo "❌ assets/css not found"
          ls -la composables/ || echo "❌ composables not found"
          ls -la public/api/ || echo "❌ public/api not found"
          echo "=== File contents preview ==="
          echo "--- design-tokens.css (first 10 lines) ---"
          head -10 assets/css/design-tokens.css || echo "❌ File not found"
          echo "--- theme-tokens.css (first 5 lines) ---" 
          head -5 assets/css/theme-tokens.css || echo "❌ File not found"
          echo "--- tokens.json (preview) ---"
          head -20 public/api/tokens.json || echo "❌ File not found"

      - name: ✅ Check for changes
        id: changes
        run: |
          echo "=== Checking for token file changes ==="
          git add assets/css/ composables/ public/api/ tokens/transformed.json || true

          # Check both staged and unstaged changes
          STAGED_CHANGES=$(git diff --cached --name-only)
          UNSTAGED_CHANGES=$(git diff --name-only)

          echo "Staged changes:"
          echo "$STAGED_CHANGES"
          echo "Unstaged changes:"
          echo "$UNSTAGED_CHANGES"

          if [ -n "$STAGED_CHANGES" ] || [ -n "$UNSTAGED_CHANGES" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Token changes detected"
            git status --porcelain
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No changes detected"
          fi

      - name: 📝 Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "Configuring git..."
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          echo "Adding generated token files to staging..."
          git add assets/css/ composables/ public/api/ tokens/transformed.json || true

          echo "Checking staged files..."
          git diff --cached --name-only

          echo "Current git status:"
          git status --porcelain

          echo "Committing generated token files..."
          git commit -m "🎨 Auto-update design tokens

          Generated from tokens/global.json via Style Dictionary

          Files updated:
          - assets/css/design-tokens.css
          - assets/css/theme-tokens.css  
          - composables/useDesignTokens.ts
          - public/api/tokens.json (GitHub Pages API)

          [skip ci]" || exit 1

          echo "Pushing changes..."
          git push

      - name: ✅ Build tokens summary
        run: |
          echo "🎯 Build tokens job completed!"
          echo "📍 Branch: ${{ github.ref_name }}"
          echo "🔄 Changes detected: ${{ steps.changes.outputs.changed }}"

  # Job 2: GitHub Pages 배포
  deploy-pages:
    runs-on: ubuntu-latest
    needs: build-tokens
    if: |
      always() && 
      (needs.build-tokens.result == 'success') &&
      (needs.build-tokens.outputs.tokens-changed == 'true' || github.event.inputs.force_build == 'true')

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🔍 Debug deployment trigger
        run: |
          echo "=== Deploy Pages Job Debug Info ==="
          echo "Event name: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Build tokens result: ${{ needs.build-tokens.result }}"
          echo "Tokens changed: ${{ needs.build-tokens.outputs.tokens-changed }}"
          echo "Force build: ${{ github.event.inputs.force_build }}"
          echo "=========================================="

      - name: 📋 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📥 Install dependencies
        run: npm install

      - name: 🎨 Build design tokens
        run: npm run tokens:build

      - name: 🔍 Verify tokens were built
        run: |
          if [ ! -f "assets/css/design-tokens.css" ]; then
            echo "Warning: design-tokens.css not found"
            touch assets/css/design-tokens.css
          fi
          if [ ! -f "public/api/tokens.json" ]; then
            echo "Warning: tokens.json not found"
            mkdir -p public/api
            echo '{"success":false,"error":{"message":"tokens not built"}}' > public/api/tokens.json
          fi
          echo "Listing public directory:"
          ls -la public/
          echo "Listing public/api directory:"
          ls -la public/api/ || echo "public/api directory not found"

      - name: 🏗️ Generate static site
        run: npm run generate

      - name: 📋 Configure Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.output/public'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: ✅ Deployment summary
        run: |
          echo "🎯 Deployment completed successfully!"
          echo "🌐 Pages URL: ${{ steps.deployment.outputs.page_url }}"
          echo "📍 Branch: ${{ github.ref_name }}"
